{% extends "admin/base_admin.html" %}
{% block title %}पासवर्ड बदलें{% endblock %}
{% block page_title %}🔐 पासवर्ड / यूजरनेम{% endblock %}
{% block content %}
<div class="admin-card" style="max-width:520px;">
  <p style="margin-bottom:16px;color:#6B4423;">पुराना पासवर्ड तुरंत बदल दें जिसे और कोई लॉगिन न कर सके।</p>
  <form method="post">
    <div class="form-group">
      <label>वर्तमान पासवर्ड *</label>
      <input type="password" name="current_password" required autocomplete="current-password">
    </div>
    <div class="form-group">
      <label>नया यूजरनेम</label>
      <input type="text" name="new_username" value="{{ session.get('username', '') }}" autocomplete="username">
    </div>
    <div class="form-group">
      <label>नया पासवर्ड (कम से कम 6 अक्षर)</label>
      <input type="password" name="new_password" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>नया पासवर्ड फिर लिखें</label>
      <input type="password" name="confirm_password" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary">सेव करें</button>
    <a href="{{ url_for('admin_dashboard') }}" class="btn">वापस</a>
  </form>
</div>
{% endblock %}
