{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<style>
  .post-container {
    max-width: 860px;
    margin: 30px auto;
    padding: 0 20px;
  }
  .post-header {
    margin-bottom: 25px;
    border-bottom: 1px solid #e8d9c8;
    padding-bottom: 18px;
  }
  .post-header h1 {
    font-size: 1.8rem;
    color: #3d1c08;
    margin-bottom: 10px;
    line-height: 1.35;
  }
  .post-meta {
    font-size: 0.9rem;
    color: #777;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }
  .post-meta span {
    background: #f5ebe0;
    padding: 3px 10px;
    border-radius: 12px;
  }
  .post-body {
    font-size: 1.05rem;
    line-height: 1.85;
    color: #333;
    white-space: pre-line;
  }
  .back-link {
    display: inline-block;
    margin-top: 30px;
    color: #c45c26;
    text-decoration: none;
    font-weight: 600;
  }
  .back-link:hover {
    text-decoration: underline;
  }
</style>

<div class="post-container">
  <div class="post-header">
    <h1>{{ post.title }}</h1>
    <div class="post-meta">
      {% if post.category %}
        <span>📁 {{ post.category.name }}</span>
      {% endif %}
      {% if post.created_at %}
        <span>📅 {{ post.created_at }}</span>
      {% endif %}
    </div>
  </div>

  <div class="post-body">
    {{ post.content|striptags }}
  </div>

  <a href="{{ url_for('index') }}" class="back-link">← वापस होम पर जाएं</a>
</div>
{% endblock %}
